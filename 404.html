<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f6fb" />
    <title>404 — Page Not Found · GBFR Save Analytics</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/relink-icon.png" type="image/png" sizes="32x32" />
    <style>
      :root {
        --paper: #f7f6fb;
        --white: #ffffff;
        --ink: #1b1a24;
        --ink-2: #45424f;
        --line: #e0dde9;
        --violet: #702c8f;
        --copper: #d0782a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background: var(--white);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        max-width: 480px;
        width: 100%;
        padding: 2.5rem 2rem;
      }
      .code {
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--violet);
        line-height: 1;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 0.5rem;
        color: var(--ink);
      }
      p {
        color: var(--ink-2);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.65rem 1.4rem;
        background: linear-gradient(135deg, #702c8f, #3860be);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(112, 44, 143, 0.25);
        transition: opacity 0.2s ease;
      }
      .btn:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a class="btn" href="/gbfr-save-analytics/">Return to GBFR Save Analytics</a>
    </main>
  </body>
</html>
